<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Telemera의 작은 기계와 이상한 방들을 탐험하세요. 디지털 병동 너머에서 만들어지는 새로운 게임의 소식을 만납니다.">
  <meta name="theme-color" content="#080b0a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Telemera">
  <meta property="og:title" content="Telemera — 다음 게임에서 만나요.">
  <meta property="og:description" content="작은 기계, 이상한 방들, 아직 태어나지 않은 게임들. Telemera의 공간을 탐험하세요.">
  <meta property="og:image" content="{{ url_for('static', filename='images/telemera-ward-panorama.png', _external=True) }}">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <title>{% block title %}Telemera / 접속 종료 실패{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  {% block styles %}{% endblock %}
  {% block scripts %}{% endblock %}
</head>
<body>
  <a class="skip" href="#content">본문으로 이동</a>
  {% include 'partials/header.html' %}
  <main id="content">{% block content %}{% endblock %}</main>
  {% include 'partials/footer.html' %}
</body>
</html>
