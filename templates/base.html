<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Telemera 게임">
  <meta name="theme-color" content="#080b0a">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Telemera">
  <meta property="og:title" content="Telemera">
  <meta property="og:description" content="Telemera 게임">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/favicon.svg') }}">
  <title>{% block title %}Telemera{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/transitions.css') }}">
  <script type="module" src="{{ url_for('static', filename='js/page-transitions.js') }}"></script>
  {% block styles %}{% endblock %}
  {% block scripts %}{% endblock %}
</head>
<body>
  <div id="page-jam" class="page-jam" hidden aria-hidden="true"></div>
  <a class="skip" href="#content">본문으로 이동</a>
  {% include 'partials/header.html' %}
  <main id="content">{% block content %}{% endblock %}</main>
  {% include 'partials/footer.html' %}
</body>
</html>
